name: CI

# push is limited to main so a branch opened as a pull request runs the live
# fletch.now smoke test once per commit, not twice.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # The logo once carried a signed C2PA content-credentials manifest. Only
      # IHDR, IDAT and IEND belong in a wordmark.
      - run: "! grep -a -q -E 'caBX|c2pa|claim_generator' docs/*.png"
      # Starts index.mjs over stdio with the SDK's own client, counts the tools
      # and resources, replays the ETag and bearer rules against local http and
      # https servers, and calls the status tool against https://fletch.now.
      - run: npm test
